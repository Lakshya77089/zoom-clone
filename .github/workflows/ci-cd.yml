name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  BACKEND_PORT: "8750"

jobs:
  checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Backend imports
        working-directory: backend
        run: |
          pip install --quiet -r requirements.txt
          python -c "import app.main"

  playwright:
    name: Playwright
    needs: checks
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Backend venv
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7

  cypress:
    name: Cypress
    needs: checks
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Backend venv
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run test:cypress
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7

  deploy:
    name: Deploy
    needs: [playwright, cypress]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.ZOOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - name: Build frontend
        working-directory: frontend
        run: npx next build
        env:
          NEXT_OUTPUT: standalone
          BACKEND_URL: http://127.0.0.1:${{ env.BACKEND_PORT }}
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Package release
        run: |
          mkdir -p release/frontend release/backend release/deploy
          cp -r frontend/.next/standalone/. release/frontend/
          cp -r frontend/.next/static release/frontend/.next/static
          echo "${GITHUB_SHA}" > release/frontend/REVISION
          cp -r backend/app backend/requirements.txt release/backend/
          find release/backend -name "__pycache__" -type d -prune -exec rm -rf {} +
          cp deploy/ecosystem.config.cjs release/deploy/
          tar -czf release.tgz -C release .
          ls -lh release.tgz
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Upload and activate
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o BatchMode=yes"
          $SSH "$TARGET" 'mkdir -p ~/apps/zoom-clone'
          scp -i ~/.ssh/deploy_key -o BatchMode=yes release.tgz deploy/remote-deploy.sh "$TARGET:apps/zoom-clone/"
          $SSH "$TARGET" 'bash ~/apps/zoom-clone/remote-deploy.sh'
      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsSL "http://${{ vars.ZOOM_DOMAIN }}/api/users/me" >/dev/null && curl -fsSL "http://${{ vars.ZOOM_DOMAIN }}/" | grep -q "Zoom Workplace"; then
              echo "Live at ${{ vars.ZOOM_DOMAIN }}"
              exit 0
            fi
            sleep 3
          done
          exit 1
